seed: 42
num_steps_per_env: 24
max_iterations: 10000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 250
experiment_name: k1_mimic
run_name: taeguek04_grf_v1_finetune_20261027_121443
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: 10.0
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    init_std: 1.0
    std_type: log
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 5.0e-06
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  rnd_cfg: null
  symmetry_cfg: null
multi_gpu: null
