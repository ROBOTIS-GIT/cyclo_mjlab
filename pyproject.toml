[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo_mjlab"
version = "0.0.3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.1",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.14.0",
    "torch==2.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["source", "source.*"]
