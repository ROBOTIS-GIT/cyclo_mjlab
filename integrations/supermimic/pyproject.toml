[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo-supermimic"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["supermimic", "pytest>=9"]

[project.scripts]
cyclo-supermimic = "cyclo_supermimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
supermimic = { path = "../../third_party/supermimic", editable = true }
mjlab = { git = "https://github.com/HybridRobotics/mjlab_research.git", rev = "dd51a9fcc98791a2f0b018b3c7f71a3eefd5ecdd" }
