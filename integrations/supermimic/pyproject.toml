[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclo-supermimic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cyclo_mjlab", "supermimic"]

[dependency-groups]
dev = ["pytest>=9"]

[project.scripts]
cyclo-supermimic = "cyclo_supermimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
supermimic = { path = "../../third_party/supermimic", editable = true }
cyclo_mjlab = { path = "../..", editable = true }
